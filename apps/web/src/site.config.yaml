# ─────────────────────────────────────────────────────────────────────────
# Sprout — page settings. Edit here to change copy/structure without touching
# code. Loaded (and type-checked) through src/site-config.ts.
# Note: lesson lists live in content/curriculum.ts (they import .md files);
# this file owns presentation — names, copy, icons, ordering.
# ─────────────────────────────────────────────────────────────────────────

brand:
  name: Sprout
  tagline: Aprender a brincar

mascot:
  name: Feijãozinho
  emoji: "🌱"

# "Saber de cor" — a cross-cutting study / reference area (not a school subject,
# not tied to a grade): things every child should know by heart — tabuadas, o
# alfabeto, os números, os dias e os meses — all read-aloud. The topic pages
# live in content/curriculum.ts (estudoSubject); this owns the section copy.
estudo:
  sectionTitle: Saber de cor
  sectionSub: "Coisas para saber de cor — toca para ouvir e treinar! 🧠"

# "Diversão" — the playful area (not a school subject, not tied to a grade):
# a magical garden that grows with every lesson done, a little arcade of games,
# and a toy box to poke at. All read-aloud; works on tablet, phone and desktop.
# The rooms live in code (apps/web/src/diversao/); this owns the section copy.
diversao:
  sectionTitle: Diversão
  sectionSub: "Joga, planta e brinca — o teu cantinho divertido! 🎉"
  # accent: a token name (resolved to var(<accent>) / var(<accent>-soft)) — the
  # single source for each room's colour, used by the hub and the home cards so
  # they agree. Green garden, coral arcade (the Diversão signature), violet box.
  rooms:
    - id: jardim
      label: O teu jardim
      blurb: "Cada lição que acabas faz crescer uma planta nova."
      icon: plant
      accent: "--primary"
    - id: jogos
      label: Jogos
      blurb: "Memória, apanha e conta — joga e aprende."
      icon: game
      accent: "--joy"
    - id: caixa
      label: Caixa de brincar
      blurb: "Toca no ecrã e faz magia com cores e bolinhas."
      icon: blocks
      accent: "--subj-en"

# "O Dicionário" — a cross-cutting reference area (not a school subject, not tied
# to a grade): word meanings for early readers, organised by letter. Each letter
# is its own page (a "lesson") that lists words as read-aloud cards. The letters
# live in content/curriculum.ts (dicionarioSubject); this owns the section copy.
dicionario:
  sectionTitle: O Dicionário
  sectionSub: "O que significam as palavras? Escolhe uma letra e toca para ouvir! 📖"

# "Países" — get-to-know-a-country area (not a school subject, not tied to a
# grade). One card per country on the home screen; each opens its own section
# of parallel lessons (o país, bandeira, hino, comida, natureza, curiosidades).
# Each country's `tier` number links to the matching tier in curriculum.ts.
# Built so two countries sit side by side with the SAME lessons — easy to
# compare, easy to add more later (up to four tiers).
paises:
  sectionTitle: Países
  sectionSub: "Conhece dois países de cima a baixo — e compara-os! 🌍"
  countries:
    - tier: 1
      label: Portugal
      blurb: "O nosso país: bandeira, hino, comida e recordes"
      icon: flag
    - tier: 2
      label: Canadá
      blurb: "Um país enorme de neve, florestas e lagos"
      icon: flag

# "O Mundo & Curiosidades" — common-sense / general-culture area (not a school
# subject, not tied to a grade). Açores and Portugal sit on the home screen;
# the wider world is gathered under the "beyond" entry. Each ring's `ring`
# number links to the matching tier in content/curriculum.ts.
mundo:
  sectionTitle: O Mundo & Curiosidades
  sectionSub: "Coisas boas de saber, dos Açores ao mundo inteiro — não é matéria de escola. 🌍"
  beyond:
    label: Pelo mundo fora
    blurb: "Europa, oceanos, continentes e maravilhas"
    sub: "Para lá de Portugal: a Europa, os oceanos e o mundo inteiro. 🌍"
    icon: world
  rings:
    - ring: 1
      label: Os Açores
      blurb: "As minhas ilhas: vulcões, lagoas e baleias"
      icon: island
      home: true
    - ring: 2
      label: Portugal
      blurb: "O nosso país de uma ponta à outra"
      icon: flag
      home: true
    - ring: 3
      label: A Europa e o Atlântico
      blurb: "O oceano à nossa volta e a Europa"
      icon: wave2
      home: false
    - ring: 4
      label: O mundo inteiro
      blurb: "Continentes, oceanos e maravilhas"
      icon: world
      home: false
