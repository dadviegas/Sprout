# ─────────────────────────────────────────────────────────────────────────
# Sprout — page settings. Edit here to change copy/structure without touching
# code. Loaded (and type-checked) through src/site-config.ts.
# Note: lesson lists live in content/curriculum.ts (they import .md files);
# this file owns presentation — names, copy, icons, ordering.
# ─────────────────────────────────────────────────────────────────────────

brand:
  name: Sprout
  tagline: Aprender a brincar

mascot:
  name: Feijãozinho
  emoji: "🌱"

# Home areas — the top-level "por onde entro?" cards. The home is a short grid
# of these instead of one long list of every section; each card opens an area
# page that gathers what used to be loose sections (see
# docs/HOME_AREAS_COMMAND_CENTER.md).
# `accent`: a colour token name (resolved to var(<accent>) / var(<accent>-soft)),
# matching the colour of the content the area holds. `id` "diversao" opens the
# Diversão hub (its own view); the other four open `view.kind === "area"`.
areas:
  sectionTitle: Áreas
  sectionSub: "Escolhe por onde queres ir — está tudo arrumado por áreas. 🧭"
  items:
    - id: escola
      label: Escola
      blurb: "As matérias por ano, do 1.º ao 6.º."
      icon: reading
      accent: "--subj-mat"
    - id: treinar
      label: Treinar
      blurb: "Saber de cor: tabuadas, alfabeto, mapas e muito mais."
      icon: target
      accent: "--area-treinar"
    - id: explorar
      label: Explorar
      blurb: "O Mundo e os países, dos Açores ao planeta inteiro."
      icon: compass
      accent: "--subj-mundo"
    - id: biblioteca
      label: Biblioteca
      blurb: "O dicionário e os verbos, de A a Z — palavras e conjugações."
      icon: letters
      accent: "--subj-pt"
    - id: teia
      label: A Teia do Saber
      blurb: "Vê numa teia como tudo se liga — temas e matérias entrelaçados."
      icon: atom
      accent: "--subj-en"
    - id: diversao
      label: Diversão
      blurb: "Jardim, jogos e caixa de brincar — o teu cantinho divertido."
      icon: sparkle
      accent: "--joy"

# "Saber de cor" — a cross-cutting study / reference area (not a school subject,
# not tied to a grade): things every child should know by heart — tabuadas, o
# alfabeto, os números, os dias e os meses — all read-aloud. The topic pages
# live in content/curriculum.ts (estudoSubject); this owns the section copy.
estudo:
  sectionTitle: Saber de cor
  sectionSub: "Coisas para saber de cor — toca para ouvir e treinar! 🧠"
  # The "Treinar" page groups the topics above by type instead of one big grid.
  # Each category lists topic ids from estudoSubject (content/curriculum.ts) —
  # the order here is the order shown. Every topic must appear in exactly one.
  categories:
    # The reading ladder, in learning order: letters → syllables → words → texts.
    # KEEP IT FIRST: the first category is the featured "começa aqui" hero tile
    # on Treinar AND feeds the 1.º-ano férias plan (site-config readingCategory).
    - label: Aprender a ler
      icon: reading
      topics: [estudo-alfabeto, estudo-silabas-p, estudo-silabas-faceis, estudo-silabas-treino, estudo-juntar-palavras, estudo-ler-palavras, estudo-leitura-rapida, estudo-testes-leitura]
    - label: Matemática rápida
      icon: math
      topics: [estudo-tabuadas, estudo-contas, estudo-numeros, estudo-dinheiro, estudo-loja, estudo-medidas, estudo-formulas, estudo-romanos]
    - label: Português rápido
      icon: reading
      topics: [estudo-pontuacao, estudo-classes, estudo-verbos]
    - label: Tempo e calendário
      icon: calendar
      topics: [estudo-relogio, estudo-dias-meses, estudo-datas]
    - label: Mundo e mapas
      icon: compass
      topics: [estudo-planetas, estudo-continentes, estudo-pontos-cardeais, estudo-distritos]
    - label: Formas e espaço
      icon: shapes
      topics: [estudo-formas]

# "Diversão" — the playful area (not a school subject, not tied to a grade):
# a magical garden that grows with every lesson done, a little arcade of games,
# and a toy box to poke at. All read-aloud; works on tablet, phone and desktop.
# The rooms live in code (apps/web/src/diversao/); this owns the section copy.
diversao:
  sectionTitle: Diversão
  sectionSub: "Joga, planta e brinca — o teu cantinho divertido! 🎉"
  # accent: a token name (resolved to var(<accent>) / var(<accent>-soft)) — the
  # single source for each room's colour, used by the hub and the home cards so
  # they agree. Green garden, coral arcade (the Diversão signature), violet box.
  rooms:
    - id: jardim
      label: O teu jardim
      blurb: "Cada lição que acabas faz crescer uma planta nova."
      icon: plant
      accent: "--primary"
    - id: jogos
      label: Jogos
      blurb: "Memória, apanha e conta — joga e aprende."
      icon: game
      accent: "--joy"
    - id: caixa
      label: Caixa de brincar
      blurb: "Toca no ecrã e faz magia com cores e bolinhas."
      icon: blocks
      accent: "--subj-en"

# "O Dicionário" — a cross-cutting reference area (not a school subject, not tied
# to a grade): word meanings for early readers, organised by letter. Each letter
# is its own page (a "lesson") that lists words as read-aloud cards. The letters
# live in content/curriculum.ts (dicionarioSubject); this owns the section copy.
dicionario:
  sectionTitle: O Dicionário
  sectionSub: "O que significam as palavras? Escolhe uma letra e toca para ouvir! 📖"

# "Os Verbos" — the conjugation half of the Biblioteca (not a school subject, not
# tied to a grade): verbs organised by letter, each opening to its five tenses,
# saying whether it is regular or irregular. The letters live in
# content/curriculum.ts (verbosSubject); this owns the section copy.
verbos:
  sectionTitle: Os Verbos
  sectionSub: "Como mudam os verbos? Escolhe uma letra e toca para conjugar e ouvir! 🏃"

# "Países" — get-to-know-a-country area (not a school subject, not tied to a
# grade). One card per country on the home screen; each opens its own section
# of parallel lessons (o país, bandeira, hino, comida, natureza, curiosidades).
# Each country's `tier` number links to the matching tier in curriculum.ts.
# Built so two countries sit side by side with the SAME lessons — easy to
# compare, easy to add more later (up to four tiers).
paises:
  sectionTitle: Países
  sectionSub: "Conhece dois países de cima a baixo — e compara-os! 🌍"
  countries:
    - tier: 1
      label: Portugal
      blurb: "O nosso país: bandeira, hino, comida e recordes"
      icon: flag
    - tier: 2
      label: Canadá
      blurb: "Um país enorme de neve, florestas e lagos"
      icon: flag

# "O Mundo & Curiosidades" — common-sense / general-culture area (not a school
# subject, not tied to a grade). Açores and Portugal sit on the home screen;
# the wider world is gathered under the "beyond" entry. Each ring's `ring`
# number links to the matching tier in content/curriculum.ts.
mundo:
  sectionTitle: O Mundo & Curiosidades
  sectionSub: "Coisas boas de saber, dos Açores ao mundo inteiro — não é matéria de escola. 🌍"
  beyond:
    label: Pelo mundo fora
    blurb: "Europa, oceanos, continentes e maravilhas"
    sub: "Para lá de Portugal: a Europa, os oceanos e o mundo inteiro. 🌍"
    icon: world
  rings:
    - ring: 1
      label: Os Açores
      blurb: "As minhas ilhas: vulcões, lagoas e baleias"
      icon: island
      home: true
    - ring: 2
      label: Portugal
      blurb: "O nosso país de uma ponta à outra"
      icon: flag
      home: true
    - ring: 3
      label: A Europa e o Atlântico
      blurb: "O oceano à nossa volta e a Europa"
      icon: wave2
      home: false
    - ring: 4
      label: O mundo inteiro
      blurb: "Continentes, oceanos e maravilhas"
      icon: world
      home: false
