<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sprout World elemental hero blueprint</title>
  <desc id="desc">Five original child-friendly elemental academy heroes for 3D modelling reference.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1a2540" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="card" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3fa"/>
    </linearGradient>
  </defs>
  <text x="80" y="78" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#172033">Academia dos Elementos - bonecos base</text>
  <text x="80" y="118" font-family="Inter, Arial, sans-serif" font-size="20" fill="#5b667a">Original, low-poly friendly, reconstruivel com primitivas em Babylon.js. Proporcoes: cabeca grande, corpo curto, botas e luvas simples.</text>

  <g transform="translate(70 170)">
    <g transform="translate(0 0)"><use href="#hero-fire"/></g>
    <g transform="translate(300 0)"><use href="#hero-water"/></g>
    <g transform="translate(600 0)"><use href="#hero-earth"/></g>
    <g transform="translate(900 0)"><use href="#hero-air"/></g>
    <g transform="translate(1200 0)"><use href="#hero-light"/></g>
  </g>

  <g id="base-card">
    <rect x="0" y="0" width="250" height="620" rx="28" fill="url(#card)" stroke="#dce4f0"/>
    <ellipse cx="125" cy="520" rx="80" ry="18" fill="#d9e2ef"/>
  </g>

  <g id="small-pet">
    <ellipse cx="0" cy="0" rx="22" ry="18" fill="currentColor" opacity="0.92"/>
    <circle cx="-7" cy="-4" r="3" fill="#172033"/>
    <circle cx="7" cy="-4" r="3" fill="#172033"/>
    <path d="M-6 6q6 6 12 0" stroke="#172033" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <g id="hero-body">
    <ellipse cx="125" cy="250" rx="48" ry="56" fill="#ffd9bd"/>
    <circle cx="108" cy="254" r="5" fill="#253047"/>
    <circle cx="142" cy="254" r="5" fill="#253047"/>
    <path d="M110 274q15 13 30 0" stroke="#253047" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M70 355q55-70 110 0l-18 150H88z" fill="currentColor"/>
    <path d="M125 315v190" stroke="#000" stroke-width="5" opacity="0.08"/>
    <rect x="78" y="420" width="35" height="110" rx="17" fill="#253047"/>
    <rect x="137" y="420" width="35" height="110" rx="17" fill="#253047"/>
    <rect x="55" y="342" width="34" height="110" rx="17" fill="currentColor" opacity="0.86"/>
    <rect x="161" y="342" width="34" height="110" rx="17" fill="currentColor" opacity="0.86"/>
    <circle cx="72" cy="456" r="18" fill="#ffd9bd"/>
    <circle cx="178" cy="456" r="18" fill="#ffd9bd"/>
    <circle cx="125" cy="395" r="24" fill="#ffffff" opacity="0.95"/>
  </g>

  <g id="hero-fire" filter="url(#softShadow)" color="#f2633b">
    <use href="#base-card"/>
    <circle cx="125" cy="315" r="108" fill="currentColor" opacity="0.1"/>
    <use href="#hero-body"/>
    <path d="M92 222c20-54 58-66 62-122 42 43 15 82 42 114-12-5-21-8-28-8 15 30 0 58-43 58-38 0-54-18-33-42z" fill="#f2633b"/>
    <path d="M115 370l18 32-36-4z" fill="#f2633b"/>
    <path d="M103 395h44l-22 34z" fill="#f2633b"/>
    <g transform="translate(198 518)" color="#f2633b"><use href="#small-pet"/></g>
    <text x="125" y="585" text-anchor="middle" font-family="Inter, Arial" font-size="24" font-weight="800" fill="#172033">Fogo</text>
    <text x="125" y="615" text-anchor="middle" font-family="Inter, Arial" font-size="16" fill="#667086">Fagulha</text>
  </g>

  <g id="hero-water" filter="url(#softShadow)" color="#21a9d8">
    <use href="#base-card"/>
    <circle cx="125" cy="315" r="108" fill="currentColor" opacity="0.11"/>
    <use href="#hero-body"/>
    <path d="M70 345c35-18 75-18 110 0-12-48-98-48-110 0z" fill="#116a8c"/>
    <path d="M94 215c22-32 42-45 67-45 16 0 29 8 39 24-28-8-53 0-77 20z" fill="#21a9d8"/>
    <path d="M125 366c22 28 34 45 34 62a34 34 0 0 1-68 0c0-17 12-34 34-62z" fill="#21a9d8"/>
    <g transform="translate(198 518)" color="#21a9d8"><use href="#small-pet"/></g>
    <text x="125" y="585" text-anchor="middle" font-family="Inter, Arial" font-size="24" font-weight="800" fill="#172033">Agua</text>
    <text x="125" y="615" text-anchor="middle" font-family="Inter, Arial" font-size="16" fill="#667086">Gota</text>
  </g>

  <g id="hero-earth" filter="url(#softShadow)" color="#5aa65c">
    <use href="#base-card"/>
    <circle cx="125" cy="315" r="108" fill="currentColor" opacity="0.11"/>
    <use href="#hero-body"/>
    <path d="M89 224c11-34 38-54 78-39 10 27-7 49-33 52-20 2-33-3-45-13z" fill="#6b4f2a"/>
    <path d="M68 342l32-40 20 36-36 20z" fill="#75bd69"/>
    <path d="M182 342l-32-40-20 36 36 20z" fill="#75bd69"/>
    <path d="M105 378h40l-20 40z" fill="#5aa65c"/>
    <rect x="68" y="510" width="58" height="28" rx="14" fill="#6b4f2a"/>
    <rect x="124" y="510" width="58" height="28" rx="14" fill="#6b4f2a"/>
    <g transform="translate(198 518)" color="#5aa65c"><use href="#small-pet"/></g>
    <text x="125" y="585" text-anchor="middle" font-family="Inter, Arial" font-size="24" font-weight="800" fill="#172033">Terra</text>
    <text x="125" y="615" text-anchor="middle" font-family="Inter, Arial" font-size="16" fill="#667086">Raiz</text>
  </g>

  <g id="hero-air" filter="url(#softShadow)" color="#7fa9e0">
    <use href="#base-card"/>
    <circle cx="125" cy="315" r="108" fill="currentColor" opacity="0.12"/>
    <use href="#hero-body"/>
    <path d="M85 226c22-38 89-38 112 0-36-12-73-10-112 0z" fill="#dbeeff"/>
    <path d="M70 335c42 18 82 18 120 0-9 28-28 42-58 43-33 1-54-13-62-43z" fill="#dbeeff"/>
    <path d="M85 388h80" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.88"/>
    <path d="M92 407h66" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.72"/>
    <g transform="translate(198 518)" color="#7fa9e0"><use href="#small-pet"/></g>
    <text x="125" y="585" text-anchor="middle" font-family="Inter, Arial" font-size="24" font-weight="800" fill="#172033">Ar</text>
    <text x="125" y="615" text-anchor="middle" font-family="Inter, Arial" font-size="16" fill="#667086">Brisa</text>
  </g>

  <g id="hero-light" filter="url(#softShadow)" color="#f0bd2e">
    <use href="#base-card"/>
    <circle cx="125" cy="315" r="108" fill="currentColor" opacity="0.13"/>
    <use href="#hero-body"/>
    <path d="M125 166l14 32 35 3-27 22 8 35-30-18-30 18 8-35-27-22 35-3z" fill="#f0bd2e"/>
    <path d="M125 362l15 34 37 4-28 24 9 36-33-19-33 19 9-36-28-24 37-4z" fill="#f0bd2e"/>
    <circle cx="125" cy="395" r="13" fill="#ffffff"/>
    <g transform="translate(198 518)" color="#f0bd2e"><use href="#small-pet"/></g>
    <text x="125" y="585" text-anchor="middle" font-family="Inter, Arial" font-size="24" font-weight="800" fill="#172033">Luz</text>
    <text x="125" y="615" text-anchor="middle" font-family="Inter, Arial" font-size="16" fill="#667086">Brilho</text>
  </g>

  <g transform="translate(82 825)">
    <text x="0" y="0" font-family="Inter, Arial" font-size="18" font-weight="700" fill="#172033">Notas 3D:</text>
    <text x="118" y="0" font-family="Inter, Arial" font-size="18" fill="#5b667a">cabeca esfera achatada, corpo capsula/cone arredondado, capa curta, emblema no peito, maos e botas simples, pet como elipsoide flutuante.</text>
  </g>
</svg>
