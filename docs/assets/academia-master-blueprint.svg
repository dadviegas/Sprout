<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Sprout World academy master blueprint</title>
  <desc id="desc">Original wise academy master with a wide hat, staff and simple low-poly friendly shapes.</desc>
  <rect width="1200" height="760" fill="#f6f8fb"/>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#162033" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="robe" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#536575"/>
      <stop offset="1" stop-color="#273747"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f0d393"/>
      <stop offset="1" stop-color="#c79642"/>
    </linearGradient>
  </defs>

  <text x="70" y="70" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="#172033">Mestre da Academia - blueprint original</text>
  <text x="70" y="108" font-family="Inter, Arial, sans-serif" font-size="19" fill="#5b667a">Mentor elemental com chapeu largo, cajado e formas simples para Babylon.js. Inspiracao: sabedoria, humor e magia calma; nao copiar IPs existentes.</text>

  <g transform="translate(130 150)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="520" rx="34" fill="#fff" stroke="#dce4f0"/>
    <ellipse cx="180" cy="450" rx="118" ry="24" fill="#d9e2ef"/>

    <!-- staff -->
    <path d="M290 165c20 100 18 210 2 310" stroke="#8a5a2b" stroke-width="16" stroke-linecap="round"/>
    <circle cx="286" cy="145" r="25" fill="#89d7ff" opacity="0.85"/>
    <path d="M286 113l12 24 26 4-19 18 5 26-24-12-24 12 5-26-19-18 26-4z" fill="#ffffff" opacity="0.9"/>

    <!-- hat -->
    <ellipse cx="180" cy="125" rx="138" ry="34" fill="url(#hat)"/>
    <path d="M88 126c36-74 72-106 92-106s58 32 92 106c-56 18-127 18-184 0z" fill="url(#hat)"/>
    <ellipse cx="180" cy="126" rx="96" ry="19" fill="#b67d31" opacity="0.25"/>
    <path d="M95 120c58 25 112 25 170 0" stroke="#fff2c4" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.75"/>

    <!-- head / face -->
    <circle cx="180" cy="174" r="48" fill="#ffd9bd"/>
    <circle cx="163" cy="171" r="5" fill="#243047"/>
    <circle cx="197" cy="171" r="5" fill="#243047"/>
    <path d="M160 194q20 17 40 0" stroke="#243047" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M126 170q34-26 54 8 22-34 54-8" stroke="#e9eef7" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M150 202q30 42 60 0" fill="#e9eef7"/>
    <path d="M166 207q14 12 28 0" stroke="#c7d2e2" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- body robe -->
    <path d="M180 230c54 0 88 48 92 160 1 26-18 40-48 40h-88c-30 0-49-14-48-40 4-112 38-160 92-160z" fill="url(#robe)"/>
    <path d="M180 230v200" stroke="#000" stroke-width="6" opacity="0.08"/>
    <path d="M127 270l106 120" stroke="#d8e0ea" stroke-width="8" opacity="0.65"/>
    <path d="M233 270L127 390" stroke="#d8e0ea" stroke-width="8" opacity="0.45"/>
    <circle cx="180" cy="315" r="27" fill="#ffffff"/>
    <path d="M180 292l9 18 20 3-15 14 4 20-18-10-18 10 4-20-15-14 20-3z" fill="#89d7ff"/>

    <!-- arms / hands -->
    <path d="M103 292c-36 34-46 76-30 112" stroke="#536575" stroke-width="28" stroke-linecap="round"/>
    <circle cx="73" cy="409" r="18" fill="#ffd9bd"/>
    <path d="M257 292c31 32 42 69 34 103" stroke="#536575" stroke-width="28" stroke-linecap="round"/>
    <circle cx="291" cy="399" r="18" fill="#ffd9bd"/>

    <!-- feet -->
    <rect x="124" y="424" width="68" height="28" rx="14" fill="#6b4f2a"/>
    <rect x="176" y="424" width="68" height="28" rx="14" fill="#6b4f2a"/>
  </g>

  <g transform="translate(570 165)">
    <text x="0" y="0" font-family="Inter, Arial" font-size="28" font-weight="800" fill="#172033">Modelo 3D recomendado</text>
    <g font-family="Inter, Arial" font-size="19" fill="#4f5d72">
      <text x="0" y="48">• Chapeu: cone baixo + elipse larga. Deve ser a silhueta principal.</text>
      <text x="0" y="86">• Cabeca: esfera achatada, olhos grandes, sobrancelhas/moustache em curvas.</text>
      <text x="0" y="124">• Barba: volume simples em gota/folha branca.</text>
      <text x="0" y="162">• Corpo: robe curto em capsula/cone arredondado.</text>
      <text x="0" y="200">• Cajado: cilindro + cristal estrela/sprout no topo.</text>
      <text x="0" y="238">• Animacao idle: chapeu abana ligeiro, barba respira, cristal pulsa.</text>
      <text x="0" y="276">• Animacao falar: mao levanta, cajado inclina, cabeca acena.</text>
      <text x="0" y="314">• Animacao celebrar: cristal brilha, pet/livro gira, confetti leve.</text>
    </g>

    <g transform="translate(0 380)">
      <text x="0" y="0" font-family="Inter, Arial" font-size="24" font-weight="800" fill="#172033">Cores</text>
      <g transform="translate(0 30)">
        <rect x="0" y="0" width="64" height="42" rx="10" fill="#f0d393"/>
        <text x="78" y="27" font-family="Inter, Arial" font-size="18" fill="#4f5d72">palha / sabedoria</text>
      </g>
      <g transform="translate(0 86)">
        <rect x="0" y="0" width="64" height="42" rx="10" fill="#536575"/>
        <text x="78" y="27" font-family="Inter, Arial" font-size="18" fill="#4f5d72">robe azul-cinza</text>
      </g>
      <g transform="translate(0 142)">
        <rect x="0" y="0" width="64" height="42" rx="10" fill="#89d7ff"/>
        <text x="78" y="27" font-family="Inter, Arial" font-size="18" fill="#4f5d72">cristal / energia calma</text>
      </g>
    </g>
  </g>
</svg>
